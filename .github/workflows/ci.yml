name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Test
        run: cargo +stable test --locked
      - name: Build release
        run: cargo +stable build --release --locked
      - name: Smoke test
        run: |
          target/release/waywe --version
          target/release/waywe --help
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: waywe-linux-${{ matrix.arch }}
          path: target/release/waywe
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: waywe-linux-*
          path: artifacts
      - name: Package binaries
        run: |
          mkdir -p release
          for arch in x86_64 aarch64; do
            chmod +x "artifacts/waywe-linux-${arch}/waywe"
            tar -czf "release/waywe-${GITHUB_REF_NAME}-linux-${arch}.tar.gz" \
              -C "artifacts/waywe-linux-${arch}" waywe \
              -C "$GITHUB_WORKSPACE" LICENSE
          done
      - name: Create checksums
        working-directory: release
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
